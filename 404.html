<script>
  // Open/close dropdown menus on click (hover also opens them on desktop, via CSS).
  document.addEventListener('click', function (e) {
    var toggle = e.target.closest('.masthead__dropdown-toggle');
    document.querySelectorAll('.masthead__menu-item--dropdown.is-open').forEach(function (li) {
      if (!toggle || li !== toggle.parentElement) {
        li.classList.remove('is-open');
        li.querySelector('.masthead__dropdown-toggle').setAttribute('aria-expanded', 'false');
      }
    });
    if (toggle) {
      var open = toggle.parentElement.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.masthead__menu-item--dropdown.is-open').forEach(function (li) {
      li.classList.remove('is-open');
      li.querySelector('.masthead__dropdown-toggle').setAttribute('aria-expanded', 'false');
    });
  });
</script>
