<style>
  :root {
    --w26-ink: #1f2933;
    --w26-muted: #5f6b7a;
    --w26-line: #e3e8ee;
    --w26-surface: #f7f9fb;
    --w26-accent: #1f6f8b;
    --w26-accent-soft: #e6f1f5;
  }

  .w26-lead { font-size: 1.05em; color: var(--w26-ink); }

  /* Accepted papers: numbered across each track, in the style of a proceedings TOC */
  .w26-count-reset { counter-reset: w26-paper; }
  .w26-paper-list { list-style: none; margin: 0 0 2em; padding: 0; border-top: 1px solid var(--w26-line); }
  .w26-paper-list li { counter-increment: w26-paper; position: relative; margin: 0; padding: .9em 0 .9em 2.6em; border-bottom: 1px solid var(--w26-line); }
  .w26-paper-list li::before { content: counter(w26-paper); position: absolute; left: 0; top: .95em; width: 1.7em; text-align: right; font-size: .85em; color: var(--w26-muted); font-variant-numeric: tabular-nums; }
  .w26-paper-list--plain li { counter-increment: none; padding-left: 0; }
  .w26-paper-list--plain li::before { content: none; }
  .w26-paper-label { display: block; margin-bottom: .2em; font-size: .7em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--w26-accent); }
  .w26-paper-title { display: block; font-size: .95em; font-weight: 600; line-height: 1.4; color: var(--w26-ink); }
  .w26-paper-authors { display: block; margin-top: .2em; font-size: .85em; font-style: italic; color: var(--w26-muted); }
  .w26-abstract { margin-top: .35em; }
  .w26-abstract summary { display: inline-block; cursor: pointer; font-size: .75em; color: var(--w26-muted); list-style: none; }
  .w26-abstract summary::-webkit-details-marker { display: none; }
  .w26-abstract summary::after { content: " +"; }
  .w26-abstract[open] summary::after { content: " \2212"; }
  .w26-abstract summary:hover { color: var(--w26-accent); }
  .w26-abstract p { margin: .5em 0 .2em; padding-left: .9em; border-left: 2px solid var(--w26-line); font-size: .82em; line-height: 1.6; color: #3d4752; overflow-wrap: anywhere; }

  /* Keynote cards */
  .w26-keynote { display: flex; gap: 1.5em; margin: 0 0 2em; padding: 1.4em; background: var(--w26-surface); border: 1px solid var(--w26-line); border-radius: 10px; }
  .w26-keynote__photo { flex: 0 0 150px; }
  .w26-keynote__photo img { display: block; width: 150px; height: 200px; object-fit: cover; object-position: top; border-radius: 8px; }
  .w26-keynote__body { flex: 1; min-width: 0; }
  .w26-keynote__name { margin: 0 !important; padding: 0 !important; border: 0 !important; font-size: 1.25em; }
  .w26-keynote__inst { margin: .1em 0 .9em; color: var(--w26-muted); font-size: .9em; }
  .w26-keynote__talk { margin: 0 0 .8em; padding: .7em .9em; background: var(--w26-accent-soft); border-radius: 6px; font-weight: 600; color: var(--w26-accent); }
  .w26-keynote__talk small { display: block; font-weight: 600; font-size: .7em; letter-spacing: .05em; text-transform: uppercase; color: var(--w26-muted); }
  .w26-keynote__label { margin: 1em 0 .3em; font-size: .75em; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--w26-muted); }
  .w26-keynote__body p { font-size: .9em; line-height: 1.6; }

  /* Under construction banner */
  .w26-construction { margin: 1.5em 0; padding: 1.5em; text-align: center; background: var(--w26-surface); border: 2px dashed var(--w26-line); border-radius: 10px; }
  .w26-construction strong { display: block; font-size: 1.2em; margin-bottom: .3em; color: var(--w26-ink); }
  .w26-construction p { margin: 0; color: var(--w26-muted); }

  @media (max-width: 600px) {
    .w26-keynote { flex-direction: column; align-items: center; padding: 1.1em; }
    .w26-keynote__photo { flex-basis: auto; }
    .w26-keynote__body { width: 100%; }
  }
</style>
