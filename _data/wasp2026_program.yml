# WASP 2026 programme (version sent by the organizers on 30 October 2026).
# Items with `paper:` take their title and authors from _data/wasp2026_papers.yml and link to the accepted papers page.
# kind: opening | keynote | panel | long | short | shared_task | break | closing

date: Monday, 10 November 2026
status: "The programme may be subject to small changes."
timezone: "China Standard Time (CST, UTC+8)"
timezone_note: >-
  All times are China Standard Time (UTC+8), the official time zone of the workshop. Each session also lists its
  start and end times in US Eastern (ET), Central European (CET) and US Pacific (PT) time. On 10 November, CST = ET + 13h
  = CET + 7h = PT + 16h, so ET and PT times for Sessions 1–2 fall on the evening of 9 November.

sessions:
