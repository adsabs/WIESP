  start and end times in US Eastern (ET), Central European (CET) and US Pacific (PT) time. On 10 November, CST = ET + 13h
  = CET + 7h = PT + 16h, so the ET times of Sessions 1–2 and the PT times of Sessions 1–3 fall on 9 November.

